    - name: Commit clean source code back to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add package.json vite.config.js index.html capacitor.config.json src/
        git commit -m "Auto-clean project structure" || exit 0
        git push
        
